name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to record the deployed image for deploy-infra.yml to reuse
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/meridian-app/api:${{ steps.vars.outputs.sha_short }}
        run: |
          # Commit SHA is baked into the image, not passed to Terraform.
          docker build --build-arg GIT_COMMIT=${{ steps.vars.outputs.sha_short }} -t "$IMAGE" app/
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: terraform init
        working-directory: infra
        run: terraform init

      # -target scopes this to the app version resource only, so an app
      # deploy can't quietly apply unrelated infra drift sitting in main.
      # The only input that changes is container_image; everything else about
      # the version (env vars, network, service account) is already in the
      # Terraform config and untouched here.
      - name: Deploy new app version
        working-directory: infra
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_third_party_api_token: ${{ secrets.THIRD_PARTY_API_TOKEN }}
          TF_VAR_container_image: ${{ steps.image.outputs.image }}
        run: |
          terraform apply -input=false -auto-approve \
            -target=google_app_engine_flexible_app_version.app

      # deploy-infra.yml runs on infra-only changes, where no fresh image gets
      # built — it needs to know what's currently deployed so an unrelated
      # infra apply doesn't roll the app back to a stale image.
      - name: Record deployed image for deploy-infra.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh variable set CURRENT_CONTAINER_IMAGE --body "${{ steps.image.outputs.image }}"
