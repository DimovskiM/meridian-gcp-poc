name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to fetch the GitHub OIDC token for WIF
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/meridian-app/api:${{ steps.vars.outputs.sha_short }}
        run: |
          # Commit SHA is baked into the image so it travels with the artifact
          # rather than being plumbed through infra config.
          docker build --build-arg GIT_COMMIT=${{ steps.vars.outputs.sha_short }} -t "$IMAGE" app/
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Migrations run before the new revision goes live, so the schema is
      # never behind the code that expects it. --wait makes a failed migration
      # fail the deploy here, before any traffic moves.
      - name: Run database migrations
        run: |
          gcloud run jobs update meridian-migrate \
            --image="${{ steps.image.outputs.image }}" \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }}
          gcloud run jobs execute meridian-migrate \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --wait

      # Updates only the image. Everything else about the service — env vars,
      # VPC egress, service account, scaling, probes — is owned by Terraform
      # (infra/cloudrun.tf), which ignores image drift so these don't fight.
      - name: Deploy new revision
        run: |
          gcloud run deploy meridian-api \
            --image="${{ steps.image.outputs.image }}" \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: Show deployed health endpoint
        run: |
          URL=$(gcloud run services describe meridian-api \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "Deployed: $URL/health"
          curl -fsS "$URL/health" | tee /dev/stderr
