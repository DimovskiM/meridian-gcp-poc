name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to fetch the GitHub OIDC token for WIF
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: terraform init
        working-directory: infra
        run: terraform init

      # Plan is saved to a file and applied verbatim, so what gets applied is
      # exactly what was planned — no re-resolution between the two steps that
      # could pick up drift or a concurrent change. The plan output is also in
      # the run log, so there's a record of what each apply actually did.
      #
      # No container_image passed: Terraform ignores image drift on the Cloud
      # Run service and job, so an infra change can't roll the app back to a
      # stale image.
      - name: terraform plan
        working-directory: infra
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_third_party_api_token: ${{ secrets.THIRD_PARTY_API_TOKEN }}
        run: terraform plan -input=false -var-file=envs/europe-west3.tfvars -out=tfplan

      - name: terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan
